<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EyeState Advanced MVP</title>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

  <style>
    body {
      margin: 0;
      background: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin-top: 20px;
      font-size: 2rem;
    }

    .container {
      position: relative;
      width: 900px;
      max-width: 95vw;
      margin-top: 20px;
    }

    video,
    canvas {
      width: 100%;
      border-radius: 16px;
    }

    canvas {
      position: absolute;
      left: 0;
      top: 0;
    }

    .stats {
      margin-top: 20px;
      width: 900px;
      max-width: 95vw;
      background: #1e293b;
      padding: 20px;
      border-radius: 16px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .card {
      background: #334155;
      padding: 16px;
      border-radius: 12px;
    }

    .label {
      font-size: 0.9rem;
      opacity: 0.7;
    }

    .value {
      font-size: 1.8rem;
      margin-top: 10px;
      font-weight: bold;
    }

    .status {
      margin-top: 20px;
      padding: 14px 24px;
      border-radius: 12px;
      font-size: 1.2rem;
      background: #1e293b;
    }
  </style>
</head>

<body>

<h1>EyeState Advanced MVP</h1>

<div class="container">
  <video class="input_video" autoplay playsinline></video>
  <canvas class="output_canvas"></canvas>
</div>

<div class="stats">

  <div class="card">
    <div class="label">Blink Count</div>
    <div class="value" id="blinkCount">0</div>
  </div>

  <div class="card">
    <div class="label">Blink Rate</div>
    <div class="value" id="blinkRate">0</div>
  </div>

  <div class="card">
    <div class="label">Eye Aspect Ratio</div>
    <div class="value" id="earValue">0.000</div>
  </div>

  <div class="card">
    <div class="label">Estimated Pupil Size</div>
    <div class="value" id="pupilSize">0.000</div>
  </div>

  <div class="card">
    <div class="label">Saccade Speed</div>
    <div class="value" id="saccadeSpeed">0.000</div>
  </div>

  <div class="card">
    <div class="label">Estimated State</div>
    <div class="value" id="stateText">Baseline</div>
  </div>

</div>

<div class="status" id="status">
  Initializing...
</div>

<script>

const videoElement = document.querySelector('.input_video');
const canvasElement = document.querySelector('.output_canvas');
const canvasCtx = canvasElement.getContext('2d');

const blinkCountEl = document.getElementById('blinkCount');
const blinkRateEl = document.getElementById('blinkRate');
const earValueEl = document.getElementById('earValue');
const pupilSizeEl = document.getElementById('pupilSize');
const saccadeSpeedEl = document.getElementById('saccadeSpeed');
const stateTextEl = document.getElementById('stateText');
const statusEl = document.getElementById('status');

let blinkCount = 0;
let blinkDetected = false;
let blinkTimestamps = [];

let previousIrisX = null;
let previousIrisY = null;
let previousTime = null;

const EAR_THRESHOLD = 0.22;

// LEFT EYE
const LEFT_EYE = {
  top: 159,
  bottom: 145,
  left: 33,
  right: 133
};

// RIGHT EYE
const RIGHT_EYE = {
  top: 386,
  bottom: 374,
  left: 362,
  right: 263
};

// LEFT IRIS LANDMARKS
const LEFT_IRIS = [468, 469, 470, 471, 472];

// RIGHT IRIS LANDMARKS
const RIGHT_IRIS = [473, 474, 475, 476, 477];

function distance(a, b) {
  return Math.sqrt(
    Math.pow(a.x - b.x, 2) +
    Math.pow(a.y - b.y, 2)
  );
}

function calculateEAR(landmarks, eye) {

  const top = landmarks[eye.top];
  const bottom = landmarks[eye.bottom];
  const left = landmarks[eye.left];
  const right = landmarks[eye.right];

  const vertical = distance(top, bottom);
  const horizontal = distance(left, right);

  return vertical / horizontal;
}

function calculateIrisCenter(landmarks, irisPoints) {

  let x = 0;
  let y = 0;

  irisPoints.forEach(index => {
    x += landmarks[index].x;
    y += landmarks[index].y;
  });

  return {
    x: x / irisPoints.length,
    y: y / irisPoints.length
  };
}

function calculatePupilSize(landmarks) {

  const irisTop = landmarks[469];
  const irisBottom = landmarks[471];
  const irisLeft = landmarks[468];
  const irisRight = landmarks[470];

  const vertical = distance(irisTop, irisBottom);
  const horizontal = distance(irisLeft, irisRight);

  return ((vertical + horizontal) / 2);
}

function getBlinkRate() {

  const now = Date.now();

  blinkTimestamps = blinkTimestamps.filter(
    t => now - t < 60000
  );

  return blinkTimestamps.length;
}

function estimateState(blinkRate, saccadeSpeed, pupilSize) {

  if (blinkRate > 25 || saccadeSpeed > 0.08) {
    return "Fatigued / Overstimulated";
  }

  if (pupilSize > 0.012) {
    return "High Cognitive Load";
  }

  if (blinkRate < 8) {
    return "Focused";
  }

  return "Baseline";
}

function onResults(results) {

  canvasElement.width = videoElement.videoWidth;
  canvasElement.height = videoElement.videoHeight;

  canvasCtx.save();

  canvasCtx.clearRect(
    0,
    0,
    canvasElement.width,
    canvasElement.height
  );

  canvasCtx.drawImage(
    results.image,
    0,
    0,
    canvasElement.width,
    canvasElement.height
  );

  if (results.multiFaceLandmarks.length > 0) {

    const landmarks = results.multiFaceLandmarks[0];

    drawConnectors(
      canvasCtx,
      landmarks,
      FACEMESH_TESSELATION,
      {
        color: '#22d3ee',
        lineWidth: 0.5
      }
    );

    // ========= BLINK TRACKING =========

    const leftEAR = calculateEAR(landmarks, LEFT_EYE);
    const rightEAR = calculateEAR(landmarks, RIGHT_EYE);

    const avgEAR = (leftEAR + rightEAR) / 2;

    earValueEl.innerText = avgEAR.toFixed(3);

    if (avgEAR < EAR_THRESHOLD && !blinkDetected) {

      blinkDetected = true;

      blinkCount++;
      blinkTimestamps.push(Date.now());

      blinkCountEl.innerText = blinkCount;
    }

    if (avgEAR > EAR_THRESHOLD) {
      blinkDetected = false;
    }

    // ========= PUPIL SIZE =========

    const pupilSize = calculatePupilSize(landmarks);

    pupilSizeEl.innerText = pupilSize.toFixed(4);

    // ========= SACCADE SPEED =========

    const irisCenter = calculateIrisCenter(
      landmarks,
      LEFT_IRIS
    );

    let saccadeSpeed = 0;

    const currentTime = performance.now();

    if (
      previousIrisX !== null &&
      previousTime !== null
    ) {

      const dx = irisCenter.x - previousIrisX;
      const dy = irisCenter.y - previousIrisY;

      const dist = Math.sqrt(dx * dx + dy * dy);

      const dt = currentTime - previousTime;

      saccadeSpeed = dist / dt;

      saccadeSpeedEl.innerText =
        saccadeSpeed.toFixed(4);
    }

    previousIrisX = irisCenter.x;
    previousIrisY = irisCenter.y;
    previousTime = currentTime;

    // ========= BLINK RATE =========

    const blinkRate = getBlinkRate();

    blinkRateEl.innerText = blinkRate;

    // ========= STATE =========

    const state = estimateState(
      blinkRate,
      saccadeSpeed,
      pupilSize
    );

    stateTextEl.innerText = state;

    statusEl.innerText = "Tracking Active";

  } else {

    statusEl.innerText = "No face detected";
  }

  canvasCtx.restore();
}

const faceMesh = new FaceMesh({

  locateFile: (file) => {
    return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
  }

});

faceMesh.setOptions({

  maxNumFaces: 1,
  refineLandmarks: true,
  minDetectionConfidence: 0.5,
  minTrackingConfidence: 0.5

});

faceMesh.onResults(onResults);

const camera = new Camera(videoElement, {

  onFrame: async () => {

    await faceMesh.send({
      image: videoElement
    });

  },

  width: 1280,
  height: 720

});

camera.start();

</script>

</body>
</html>
