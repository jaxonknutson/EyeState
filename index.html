<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>EyeState 60-Second Nervous System Test</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

<style>

body{
    margin:0;
    background:#0f172a;
    color:white;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

#app{
    width:100vw;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

video{
    position:absolute;
    opacity:0;
    pointer-events:none;
}

canvas{
    position:absolute;
    width:100vw;
    height:100vh;
}

.screen{
    z-index:10;
    text-align:center;
    max-width:800px;
}

h1{
    font-size:3rem;
    margin-bottom:20px;
}

h2{
    font-size:2rem;
}

p{
    font-size:1.2rem;
    opacity:.8;
    line-height:1.6;
}

button{
    padding:16px 32px;
    border:none;
    border-radius:12px;
    background:#2563eb;
    color:white;
    font-size:1.1rem;
    cursor:pointer;
    margin-top:20px;
}

#dot{
    width:30px;
    height:30px;
    background:white;
    border-radius:50%;
    position:absolute;
    z-index:5;
    display:none;
}

#flash{
    position:absolute;
    width:100vw;
    height:100vh;
    background:white;
    opacity:0;
    pointer-events:none;
    z-index:20;
}

#resultBox{
    background:#1e293b;
    padding:40px;
    border-radius:20px;
    width:600px;
    max-width:90vw;
}

.metric{
    margin-top:20px;
    font-size:1.1rem;
}

.big{
    font-size:3rem;
    font-weight:bold;
    margin-top:20px;
}

</style>
</head>

<body>

<div id="app">

<video class="input_video" autoplay playsinline></video>
<canvas class="output_canvas"></canvas>

<div id="flash"></div>
<div id="dot"></div>

<div class="screen" id="screen">

<h1>EyeState</h1>

<p id="participantText"></p>

<p>
60-second nervous system assessment using:
<br><br>
• Blink dynamics<br>
• Pupil behavior<br>
• Eye movement speed<br>
• Smooth pursuit tracking
</p>

<button onclick="startTest()">
Start Test
</button>

</div>

</div>

<script>

// ==========================================
// USER FROM URL
// ==========================================

const params =
    new URLSearchParams(window.location.search);

const user =
    params.get("user") || "Unknown";

document.getElementById("participantText").innerHTML =
    `Participant: <strong>${user}</strong>`;

// ==========================================
// GOOGLE SHEETS SCRIPT URL
// ==========================================

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbyXQuZdRfbCAvpVqfF3b9pFpkO4KvZCihpD6gqGmCAz4Py8K0XlNE6YewU9rZfR-6yF/exec";

// ==========================================

const screen = document.getElementById("screen");
const dot = document.getElementById("dot");
const flash = document.getElementById("flash");

const videoElement =
    document.querySelector('.input_video');

const canvasElement =
    document.querySelector('.output_canvas');

const canvasCtx =
    canvasElement.getContext('2d');

let currentPhase = 0;

let blinkCount = 0;
let blinkDetected = false;
let blinkTimestamps = [];

let pupilSamples = [];
let saccadeSamples = [];
let pursuitErrors = [];

let previousIrisX = null;
let previousIrisY = null;
let previousTime = null;

let targetX = window.innerWidth / 2;
let targetY = window.innerHeight / 2;

const EAR_THRESHOLD = 0.22;

const LEFT_EYE = {
    top:159,
    bottom:145,
    left:33,
    right:133
};

const RIGHT_EYE = {
    top:386,
    bottom:374,
    left:362,
    right:263
};

const LEFT_IRIS = [468,469,470,471,472];

// ==========================================
// HELPERS
// ==========================================

function distance(a,b){

    return Math.sqrt(
        Math.pow(a.x-b.x,2)+
        Math.pow(a.y-b.y,2)
    );
}

function calculateEAR(landmarks, eye){

    const top = landmarks[eye.top];
    const bottom = landmarks[eye.bottom];
    const left = landmarks[eye.left];
    const right = landmarks[eye.right];

    const vertical = distance(top,bottom);
    const horizontal = distance(left,right);

    return vertical/horizontal;
}

function calculateIrisCenter(landmarks){

    let x = 0;
    let y = 0;

    LEFT_IRIS.forEach(index=>{

        x += landmarks[index].x;
        y += landmarks[index].y;

    });

    return {
        x:x/LEFT_IRIS.length,
        y:y/LEFT_IRIS.length
    };
}

function calculatePupilSize(landmarks){

    const irisTop = landmarks[469];
    const irisBottom = landmarks[471];
    const irisLeft = landmarks[468];
    const irisRight = landmarks[470];

    const vertical = distance(irisTop, irisBottom);
    const horizontal = distance(irisLeft, irisRight);

    return (vertical + horizontal)/2;
}

function average(arr){

    if(arr.length===0) return 0;

    return arr.reduce((a,b)=>a+b,0)/arr.length;
}

function moveDot(x,y){

    dot.style.left = `${x}px`;
    dot.style.top = `${y}px`;
}

// ==========================================
// GOOGLE SHEETS UPLOAD
// ==========================================

async function uploadResults(data){

    try {

        await fetch(SCRIPT_URL, {

            method:"POST",

            body:JSON.stringify(data)

        });

        console.log("Upload success");

    } catch(err){

        console.error(err);
    }
}

// ==========================================
// TEST FLOW
// ==========================================

function startTest(){

    screen.innerHTML = `
        <h2>Calibration</h2>
        <p>Keep your face centered</p>
    `;

    currentPhase = 1;

    setTimeout(startBaseline,5000);
}

function startBaseline(){

    screen.innerHTML = `
        <h2>Baseline Measurement</h2>
        <p>Look at the center dot naturally</p>
    `;

    dot.style.display = "block";

    targetX = window.innerWidth/2;
    targetY = window.innerHeight/2;

    moveDot(targetX,targetY);

    currentPhase = 2;

    setTimeout(startFlashTest,15000);
}

function startFlashTest(){

    screen.innerHTML = `
        <h2>Pupil Reflex Test</h2>
        <p>Keep looking at the dot</p>
    `;

    currentPhase = 3;

    let flashes = 0;

    const interval = setInterval(()=>{

        flash.style.opacity = 1;

        setTimeout(()=>{
            flash.style.opacity = 0;
        },120);

        flashes++;

        if(flashes >= 5){

            clearInterval(interval);

            setTimeout(startSaccadeTest,2000);
        }

    },2000);

}

function startSaccadeTest(){

    screen.innerHTML = `
        <h2>Saccade Test</h2>
        <p>Follow the dot as quickly as possible</p>
    `;

    currentPhase = 4;

    let jumps = 0;

    const interval = setInterval(()=>{

        targetX =
            Math.random() * (window.innerWidth - 200) + 100;

        targetY =
            Math.random() * (window.innerHeight - 200) + 100;

        moveDot(targetX,targetY);

        jumps++;

        if(jumps >= 10){

            clearInterval(interval);

            setTimeout(startSmoothPursuit,1000);
        }

    },1000);

}

function startSmoothPursuit(){

    screen.innerHTML = `
        <h2>Smooth Pursuit</h2>
        <p>Keep your eyes locked on the moving dot</p>
    `;

    currentPhase = 5;

    let t = 0;

    const interval = setInterval(()=>{

        t += 0.05;

        targetX =
            window.innerWidth/2 +
            Math.sin(t) * 300;

        targetY =
            window.innerHeight/2;

        moveDot(targetX,targetY);

    },16);

    setTimeout(()=>{

        clearInterval(interval);

        finishTest();

    },15000);

}

// ==========================================
// FINISH TEST
// ==========================================

function finishTest(){

    currentPhase = 6;

    dot.style.display = "none";

    const avgPupil = average(pupilSamples);
    const avgSaccade = average(saccadeSamples);
    const avgPursuit = average(pursuitErrors);

    let score = 100;

    score -= blinkCount * 0.5;
    score -= avgSaccade * 300;
    score -= avgPursuit * 4000;

    score = Math.max(
        0,
        Math.min(100, Math.round(score))
    );

    let state = "";

    if(score > 85){

        state = "Recovered / Regulated";

    } else if(score > 70){

        state = "Baseline";

    } else if(score > 50){

        state = "Cognitively Loaded";

    } else {

        state = "Fatigued / Dysregulated";
    }

    // ==========================================
    // UPLOAD RESULTS
    // ==========================================

    uploadResults({

        user:user,
        score:score,
        state:state,
        blinkCount:blinkCount,
        avgPupil:avgPupil,
        avgSaccade:avgSaccade,
        avgPursuit:avgPursuit

    });

    // ==========================================
    // SHOW RESULTS
    // ==========================================

    screen.innerHTML = `

        <div id="resultBox">

            <h1>Your State</h1>

            <div class="big">
                ${state}
            </div>

            <div class="metric">
                Participant: ${user}
            </div>

            <div class="metric">
                Nervous System Score: ${score}/100
            </div>

            <div class="metric">
                Blink Count: ${blinkCount}
            </div>

            <div class="metric">
                Avg Pupil Size: ${avgPupil.toFixed(4)}
            </div>

            <div class="metric">
                Avg Saccade Speed: ${avgSaccade.toFixed(4)}
            </div>

            <div class="metric">
                Smooth Pursuit Error: ${avgPursuit.toFixed(4)}
            </div>

        </div>

    `;
}

// ==========================================
// MEDIAPIPE
// ==========================================

function onResults(results){

    canvasElement.width = videoElement.videoWidth;
    canvasElement.height = videoElement.videoHeight;

    canvasCtx.save();

    canvasCtx.clearRect(
        0,
        0,
        canvasElement.width,
        canvasElement.height
    );

    if(results.multiFaceLandmarks.length > 0){

        const landmarks =
            results.multiFaceLandmarks[0];

        const leftEAR =
            calculateEAR(landmarks,LEFT_EYE);

        const rightEAR =
            calculateEAR(landmarks,RIGHT_EYE);

        const avgEAR =
            (leftEAR + rightEAR)/2;

        if(avgEAR < EAR_THRESHOLD && !blinkDetected){

            blinkDetected = true;

            blinkCount++;
            blinkTimestamps.push(Date.now());
        }

        if(avgEAR > EAR_THRESHOLD){

            blinkDetected = false;
        }

        const pupilSize =
            calculatePupilSize(landmarks);

        pupilSamples.push(pupilSize);

        const irisCenter =
            calculateIrisCenter(landmarks);

        const currentTime =
            performance.now();

        if(previousIrisX !== null){

            const dx =
                irisCenter.x - previousIrisX;

            const dy =
                irisCenter.y - previousIrisY;

            const dist =
                Math.sqrt(dx*dx + dy*dy);

            const dt =
                currentTime - previousTime;

            const velocity = (dist / dt) * 1000;

            saccadeSamples.push(Math.max(0, velocity));
            
            if(currentPhase === 5){

                const screenX =
                    irisCenter.x * window.innerWidth;

                const error =
                    Math.abs(screenX - targetX);

                pursuitErrors.push(
                    error/window.innerWidth
                );
            }
        }

        previousIrisX = irisCenter.x;
        previousIrisY = irisCenter.y;
        previousTime = currentTime;
    }

    canvasCtx.restore();
}

const faceMesh = new FaceMesh({

    locateFile:(file)=>{
        return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
    }

});

faceMesh.setOptions({

    maxNumFaces:1,
    refineLandmarks:true,
    minDetectionConfidence:0.5,
    minTrackingConfidence:0.5

});

faceMesh.onResults(onResults);

const camera = new Camera(videoElement, {

    onFrame: async ()=>{

        await faceMesh.send({
            image: videoElement
        });

    },

    width:1280,
    height:720

});

camera.start();

</script>

</body>
</html>
